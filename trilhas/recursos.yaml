# Conteúdo de estudo gratuito e aberto das trilhas.
#
# Três blocos:
#   gerais   conteúdo para começar, mostrado no topo de todas as trilhas
#   areas    conteúdo por área (id da área -> links), mostrado no topo da trilha da área
#   skills   conteúdo por tecnologia (id da taxonomia -> links), mostrado em cada tecnologia da trilha
#
# Regras:
# - Só documentação oficial e conteúdo gratuito, e SÓ links que responderam HTTP 200 na hora de incluir.
# - O LLM nunca escolhe nem inventa links: ele só organiza as etapas; os links vêm daqui.
# - nivel é o do CONTEÚDO (basico | intermediario | avancado): a trilha mostra primeiro o básico.
# - licenca só existe quando a API do GitHub informa a licença do repositório (SPDX). Sem ela, o item é
#   gratuito/aberto ao acesso, mas não afirmamos "código aberto".
# - idioma: pt | en     tipo: documentação | curso | livro | guia | repositório | vídeo | jogo | ferramenta | dados | artigo | comunidade
# Revalide de tempos em tempos:  python -m trilhas.verificar_links
# Tecnologia sem entrada aqui aparece na trilha sem link.

